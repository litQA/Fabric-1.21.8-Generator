plugins {
    id 'fabric-loom' version '1.15.5'
}

version = '1.0'
group = 'com.yourname'
base.archivesName = 'modid'
actualmodid = '${modid}'

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = actualmodid + ".refmap.json"
    }

    if (file("src/main/resources/META-INF/${modid}.classtweaker").exists())
        accessWidenerPath = file("src/main/resources/META-INF/${modid}.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${generator.getGeneratorMinecraftVersion()}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.20.1"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.136.1+${generator.getGeneratorMinecraftVersion()}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

apply from: 'mcreator.gradle'
